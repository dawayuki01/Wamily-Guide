name: Curation Cleanup 2026-05-10 (one-time)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（Notion更新なし）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Run cleanup
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_CURATION_DB_ID: ${{ secrets.NOTION_CURATION_DB_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          node scripts/curation-cleanup-2026-05-10.js $ARGS

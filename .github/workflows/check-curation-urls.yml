name: Check Curation URLs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'ドライラン（Notion更新なし）'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      slug:
        description: '対象国の slug（任意・空なら全国）例: hongkong, london'
        required: false
        default: ''
        type: string

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Run check-curation-urls
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_CURATION_DB_ID: ${{ secrets.NOTION_CURATION_DB_ID }}
          SLACK_WEBHOOK_CONTENT: ${{ secrets.SLACK_WEBHOOK_CONTENT }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "${{ inputs.slug }}" ]; then
            ARGS="$ARGS --slug ${{ inputs.slug }}"
          fi
          echo "実行: node scripts/check-curation-urls.js $ARGS"
          node scripts/check-curation-urls.js $ARGS
